services:
  - type: web
    name: gradeup
    env: python
    region: oregon
    plan: free
    buildCommand: |
      python --version
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DISABLE_EMAIL_VERIFICATION
        value: true
      - key: SECRET_KEY
        generateValue: true 